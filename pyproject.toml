[tool.poetry]
name = "pyzdcf"
version = "1.0.3"
description = "Python module used for robust estimation of cross-correlation functions of sparse and unevenly sampled astronomical time-series. It emulates a Fortran program called ZDCF which is based on the Z-transformed Discrete Correlation Function algorithm (ZDCF, Alexander 1997)."
authors = ["Isidora Jankov <ijankov@proton.me>"]
readme = "README.md"
license = "MIT"

classifiers = [
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Programming Language :: Python :: 3.14",
"Programming Language :: Python :: 3.15",
"Intended Audience :: Science/Research",
"Topic :: Scientific/Engineering :: Astronomy" 
]

include = [
"LICENSE",
]

repository = "https://github.com/LSST-sersag/pyzdcf"

[tool.poetry.dependencies]
python = ">=3.9,<3.16"
numpy = [
    { version = ">=1.21.6,<2.0", python = ">=3.9,<3.11" },
    { version = ">=2.4.4,<3.0", python = ">=3.11,<3.15" },
    { version = ">=2.5.4,<3.0", python = ">=3.15,<3.16" },
]
pandas = [
    { version = ">=2.2.3,<3.0", python = ">=3.9,<3.11" },
    { version = ">=3.0.2,<4.0", python = ">=3.11,<3.15" },
    { version = ">=3.0.6,<4.0", python = ">=3.15,<3.16" },
]

[tool.poetry.group.dev.dependencies]
pytest = [
    { version = "^7.2.0", python = ">=3.9,<3.15" },
    { version = ">=9.1.1,<10", python = ">=3.15,<3.16" },
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
